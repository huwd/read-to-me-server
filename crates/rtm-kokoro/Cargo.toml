[package]
name = "rtm-kokoro"
version = "0.1.0"
description = "The Kokoro-82M speech engine: ONNX Runtime via ort, pronunciation via misaki-rs (ADR-0007, ADR-0014)."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Our fork: upstream Misaki lexicons and two patches (ADR-0014). Fetched anonymously over
# HTTPS; pinned by commit, and Cargo.lock records it too.
misaki-rs = { version = "0.6.0", git = "https://github.com/huwd/misaki-rs", rev = "8ac866e079e95acfb53b2a8a36f9c9bc8dd176c6" }
# ONNX Runtime binaries are downloaded at build time and verified against the SHA-256
# shipped in ort-sys (ADR-0014). Exact version: the API is still a release candidate.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"] }
rtm-speech = { version = "0.1.0", path = "../rtm-speech" }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]

