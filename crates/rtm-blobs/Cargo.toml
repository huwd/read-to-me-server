[package]
name = "rtm-blobs"
version = "0.1.0"
description = "Content-addressed blob storage for read-to-me (ADR-0008)."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
rtm-domain = { version = "0.1.0", path = "../rtm-domain" }
tokio = { version = "1.53.3", features = ["fs", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
