[package]
name = "rtm-speech"
version = "0.1.0"
description = "The SpeechEngine port, text segmentation, WAV handling and the fake engine (FR-TTS-03/04)."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.1"
hound = "3.5.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "time", "rt"] }

[dev-dependencies]
serde_json = "1.0.154"
