[package]
name = "rtm-pipeline"
version = "0.1.0"
description = "read-to-me's pipeline workers and stages."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rtm-article = { version = "0.1.0", path = "../rtm-article" }
rtm-blobs = { version = "0.1.0", path = "../rtm-blobs" }
rtm-domain = { version = "0.1.0", path = "../rtm-domain" }
rtm-extract = { version = "0.1.0", path = "../rtm-extract" }
rtm-fetch = { version = "0.1.0", path = "../rtm-fetch" }
rtm-narrate = { version = "0.1.0", path = "../rtm-narrate" }
rtm-ports = { version = "0.1.0", path = "../rtm-ports" }
rtm-speech = { version = "0.1.0", path = "../rtm-speech" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["time", "sync", "macros", "process", "io-util"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
rtm-store = { version = "0.1.0", path = "../rtm-store" }
rtm-tts = { version = "0.1.0", path = "../rtm-tts" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
