[package]
name = "rtm-tts"
version = "0.1.0"
description = "The rtm tts process: speech synthesis over HTTP (ADR-0007)."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
rtm-speech = { version = "0.1.0", path = "../rtm-speech" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["sync", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
