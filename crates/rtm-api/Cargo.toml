[package]
name = "rtm-api"
version = "0.1.0"
description = "HTTP API for read-to-me: routes, middleware and serving."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
blake3 = "1.8.7"
getrandom = "0.4.3"
quick-xml = "0.42.0"
rtm-blobs = { version = "0.1.0", path = "../rtm-blobs" }
rtm-domain = { version = "0.1.0", path = "../rtm-domain" }
rtm-ports = { version = "0.1.0", path = "../rtm-ports" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
blake3 = "1.8.7"
http-body-util = "0.1.5"
roxmltree = "0.21.1"
rtm-store = { version = "0.1.0", path = "../rtm-store" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
