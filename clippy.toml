# Outbound HTTP goes only through rtm_fetch::SafeFetcher, the egress guard (ADR-0005).
# Any other HTTP client would bypass its address checks, so naming the client types at
# all is a lint error outside the guard. That covers every way of building one (new,
# builder, Default, ...); the free functions that build one internally are banned too.
disallowed-types = [
    { path = "reqwest::Client", reason = "outbound HTTP must go through rtm_fetch::SafeFetcher (ADR-0005)" },
    { path = "reqwest::ClientBuilder", reason = "outbound HTTP must go through rtm_fetch::SafeFetcher (ADR-0005)" },
]
disallowed-methods = [
    { path = "reqwest::get", reason = "outbound HTTP must go through rtm_fetch::SafeFetcher (ADR-0005)" },
]
