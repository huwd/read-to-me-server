# Per-PR quality gates (docs/05-quality-cicd-observability.md §2.1).
# Third-party actions are pinned by commit SHA; Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The encode tests run real ffmpeg (ADR-0009); they fail on CI if it's missing.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        # rtm-kokoro has its own job: it needs cmake, libclang and ONNX Runtime (ADR-0014).
        run: cargo clippy --workspace --exclude rtm-kokoro --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude rtm-kokoro --locked

  kokoro:
    name: Kokoro engine (feature build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: kokoro
      # cmake and clang (with libclang) are on the runner image; espeak-ng builds from
      # source, and ort downloads ONNX Runtime, verified by its pinned SHA-256.
      - name: Clippy
        run: cargo clippy -p rtm-kokoro -p rtm-bin --features rtm-bin/kokoro --all-targets --locked -- -D warnings
      - name: Test
        # The real-model test is ignored here: it needs the model files.
        run: cargo test -p rtm-kokoro -p rtm-bin --features rtm-bin/kokoro --locked

  image:
    name: Server image and end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          config: .hadolint.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: rtm
          tags: rtm:e2e
          load: true
          cache-from: type=gha,scope=rtm
          cache-to: type=gha,scope=rtm,mode=max
      - name: Size budget
        # docs/05 §2.1: at most 50 MB, measured compressed, as pulled (ADR-0015).
        run: |
          bytes=$(docker save rtm:e2e | gzip -c | wc -c)
          echo "rtm image: $((bytes / 1000000)) MB compressed"
          [ "$bytes" -le 50000000 ]
      # The test checks the episode with ffprobe and ffmpeg's loudness meter.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: End-to-end test
        run: e2e/run.sh

  tts-image:
    name: TTS image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Builds Kokoro and fetches the pinned model files; the e2e test uses the fake
      # engine, so this only checks the image builds.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tts
          cache-from: type=gha,scope=tts
          cache-to: type=gha,scope=tts,mode=max

  deny:
    name: Licences and advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources advisories

  docs:
    name: Docs cross-references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check links
        run: cargo xtask docs-links check

  commits:
    name: Commit standards and DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask commits "${BASE_SHA}..${HEAD_SHA}"

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
