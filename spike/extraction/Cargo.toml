[package]
name = "extraction-spike"
version = "0.0.0"
description = "Phase 0 spike: compare Rust article extractors on the corpus (issue #13). Throwaway; never shipped."
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# A standalone workspace, so the spike's dependencies stay out of the product's
# Cargo.lock and licence/advisory gates.
[workspace]

[dependencies]
dom_smoothie = "0.18.2"
legible = "0.5.1"
readability = { version = "0.3.0", default-features = false }
readabilityrs = "0.1.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trafilatura = "0.3.0"
url = "2"
